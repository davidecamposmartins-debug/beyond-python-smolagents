<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DC Martins Studios</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #1a1a1a, #3a2a1a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', Arial, sans-serif;
}

/* Container geral */
.scene {
  position: relative;
}

/* Celular */
.phone {
  width: 300px;
  height: 560px;
  background: #000;
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  transform: rotate(-12deg);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Tela */
.screen {
  width: 92%;
  height: 94%;
  background: linear-gradient(180deg, #111, #1f1f1f);
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
  padding: 20px;
}

/* Texto */
.screen h1 {
  font-size: 28px;
  margin: 0;
  font-weight: 700;
}

.screen p {
  margin: 10px 0 20px;
  font-size: 16px;
  opacity: 0.9;
}

/* Botão */
.btn {
  background: #ff9f1a;
  color: #000;
  padding: 10px 22px;
  border-radius: 20px;
  font-weight: 600;
  text-decoration: none;
}

/* Rodapé */
.footer {
  position: absolute;
  bottom: 20px;
  font-size: 12px;
  opacity: 0.5;
}
</style>
</head>

<body>

<div class="scene">
  <div class="phone">
    <div class="screen">
      <h1>Orçamento rápido</h1>
      <p>Chama no direct</p>
      <a class="btn" href="https://instagram.com/dcmartinsstudios" target="_blank">
        Direct
      </a>
      <div class="footer">DC Martins Studios</div>
    </div>
  </div>
</div>

</body>
</html>
